    <!-- Canvas node -->
    <g transform="translate(286 96)">
      <rect width="300" height="196" rx="10" fill="url(#glass)" stroke="#C9CDD1" stroke-opacity="0.45"/>
      <rect width="300" height="36" rx="9" fill="url(#alu)"/>
      <rect x="0" y="27" width="300" height="9" fill="url(#alu)"/>
      <text class="label" x="14" y="23" fill="#1A110C" font-size="12" letter-spacing="1.2">COMPRESSOR</text>
      <circle cx="276" cy="18" r="5" fill="#E5483A"/>
      <circle cx="14" cy="76" r="22" fill="url(#alu)" stroke="#5A2E1B" stroke-width="3"/>
      <circle cx="14" cy="76" r="22" fill="none" stroke="#1A110C" stroke-opacity="0.5" stroke-width="5" stroke-dasharray="2 6"/>
      <rect x="11" y="54" width="6" height="14" rx="2" fill="#1A110C"/>
      <circle cx="14" cy="76" r="4" fill="#E5483A"/>
