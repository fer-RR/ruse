      <line x1="0" y1="196" x2="300" y2="196" stroke="#2FD3D8" stroke-opacity="0.4"/>
    </g>

    <!-- Mixer strip -->
    <g transform="translate(610 96)">
      <rect width="180" height="196" rx="9" fill="#2A211A" stroke="#C9CDD1" stroke-opacity="0.2"/>
      <text class="eyebrow" x="12" y="22">MIXER / MASTER</text>
      <rect x="12" y="36" width="156" height="5" rx="2" fill="#0C0A08"/>
      <rect x="12" y="36" width="118" height="5" rx="2" fill="#59E0C0"/>
      <rect x="12" y="52" width="156" height="5" rx="2" fill="#0C0A08"/>
      <rect x="12" y="52" width="96" height="5" rx="2" fill="#FFB25E"/>
      <g transform="translate(34 78)">
        <rect width="14" height="76" rx="7" fill="#0C0A08"/>
        <rect x="3" y="18" width="8" height="28" rx="4" fill="#C9CDD1"/>
        <line x1="0" y1="32" x2="14" y2="32" stroke="#F1E8DA" stroke-width="2"/>
      </g>
      <text class="mono" x="64" y="94" fill="#C9BDA9">WIDTH</text>
      <rect x="64" y="104" width="102" height="6" rx="3" fill="#0C0A08"/>
      <rect x="64" y="104" width="68" height="6" rx="3" fill="#2FD3D8"/>
      <text class="mono" x="64" y="132" fill="#C9BDA9">A/B</text>
      <rect x="64" y="142" width="102" height="6" rx="3" fill="#0C0A08"/>
      <rect x="64" y="142" width="34" height="6" rx="3" fill="#FFB25E"/>
      <text class="mono" x="12" y="180" fill="#8E8271">PEAK -1.2 dBFS</text>
      <circle cx="160" cy="176" r="4" fill="#E5483A"/>
    </g>

