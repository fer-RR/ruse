    <g transform="translate(286 314)">
      <rect width="742" height="226" rx="10" fill="#0F0B08" stroke="#C9CDD1" stroke-opacity="0.18"/>
      <rect width="742" height="30" rx="9" fill="#2A211A"/>
      <rect x="0" y="21" width="742" height="9" fill="#2A211A"/>
      <text class="eyebrow" x="14" y="20">TIMELINE</text>
      <text class="mono" x="700" y="20" fill="#6FE3E6">00:01:24.320</text>
      <g transform="translate(14 46)">
        <line x1="0" y1="0" x2="714" y2="0" stroke="#C9CDD1" stroke-opacity="0.16"/>
        <g stroke="#2FD3D8" stroke-opacity="0.5">
          <line x1="0" y1="0" x2="0" y2="8"/><line x1="102" y1="0" x2="102" y2="8"/>
          <line x1="204" y1="0" x2="204" y2="8"/><line x1="306" y1="0" x2="306" y2="8"/>
          <line x1="408" y1="0" x2="408" y2="8"/><line x1="510" y1="0" x2="510" y2="8"/>
          <line x1="612" y1="0" x2="612" y2="8"/>
        </g>
        <rect x="0" y="16" width="714" height="58" rx="4" fill="#1A120D"/>
        <rect x="14" y="24" width="330" height="42" rx="4" fill="#241A13" stroke="#2FD3D8" stroke-opacity="0.55"/>
        <path d="M20 52 C40 38 60 62 80 48 S120 34 140 50 S180 66 200 48 S240 34 260 52 S300 62 320 48" fill="none" stroke="#2FD3D8" stroke-width="1.5"/>
        <rect x="360" y="24" width="220" height="42" rx="4" fill="#241A13" stroke="#FFB25E" stroke-opacity="0.45"/>
        <path d="M366 52 C386 40 406 64 426 48 S466 34 486 52 S526 62 546 46" fill="none" stroke="#FFB25E" stroke-width="1.5"/>
        <line x1="430" y1="16" x2="430" y2="74" stroke="#FFB25E" stroke-width="1.5"/>
        <circle cx="430" cy="16" r="4" fill="#E5483A"/>
        <rect x="0" y="82" width="714" height="42" rx="4" fill="#1A120D"/>
        <rect x="60" y="90" width="400" height="26" rx="4" fill="#241A13" stroke="#C9CDD1" stroke-opacity="0.2"/>
        <path d="M66 108 C86 96 106 118 126 104 S166 92 186 108 S226 118 246 102 S286 90 306 108 S346 118 366 102 S406 90 426 108" fill="none" stroke="#C9CDD1" stroke-width="1.2" opacity="0.7"/>
      </g>
    </g>

    <!-- Settings rows -->
    <g transform="translate(286 558)">
      <rect width="742" height="142" rx="10" fill="#241A13" stroke="#C9CDD1" stroke-opacity="0.18"/>
      <text class="eyebrow" x="16" y="24">AUDIO ENGINE</text>
      <text class="label" x="16" y="50" fill="#F1E8DA">Auto audio settings</text>
      <rect x="650" y="38" width="36" height="18" rx="9" fill="#1F6947"/>
      <circle cx="677" cy="47" r="7" fill="#59E0C0"/>
      <line x1="16" y1="68" x2="726" y2="68" stroke="#C9CDD1" stroke-opacity="0.12"/>
      <text class="label" x="16" y="90" fill="#F1E8DA">Low-latency mode</text>
      <rect x="650" y="78" width="36" height="18" rx="9" fill="#303B49"/>
      <circle cx="659" cy="87" r="7" fill="#8E8271"/>
      <line x1="16" y1="108" x2="726" y2="108" stroke="#C9CDD1" stroke-opacity="0.12"/>
      <text class="label" x="16" y="130" fill="#F1E8DA">Find best audio settings</text>
      <rect x="620" y="116" width="106" height="22" rx="5" fill="#3A2D22" stroke="#C9CDD1" stroke-opacity="0.22"/>
      <text class="mono" x="673" y="131" text-anchor="middle" fill="#C9BDA9">TEST</text>
    </g>
  </g>

  <text class="sub" x="48" y="872">Mockup preview — the live Receiver theme is selectable in Settings &gt; Interface &gt; Theme.</text>
</svg>
